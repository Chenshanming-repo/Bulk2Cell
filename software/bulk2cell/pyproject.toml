[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bulk2cell"
version = "0.1.0"
description = "Bulk long-read-assisted single-cell short-read isoform quantification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "pysam>=0.22,<0.24", "threadpoolctl>=3,<4"]

[project.optional-dependencies]
evaluation = ["scikit-learn>=1.3,<2"]
umap = ["umap-learn>=0.5,<0.6"]
test = ["pytest>=7,<9"]

[project.scripts]
bulk2cell = "bulk2cell.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
